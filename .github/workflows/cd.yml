name: CD

on:
  push:
    branches: [main]

# Queue deploys instead of cancelling: two rapid main pushes must never clobber
# a live rollout. cancel-in-progress: false makes the newer run wait its turn.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Lowercase: kubelet/containerd reject image names with uppercase owner
  # segments (ghcr.io is case-insensitive, but the image ref must be lowercase).
  IMAGE_NAME: ghcr.io/shijoebytesbric/bookmarks-api

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # for SLSA provenance attestation
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # immutable per-commit tag
            type=sha,prefix=sha-,format=short
            # rolling tag on the default branch
            type=raw,value=main

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA provenance + SBOM attestations on the image
          provenance: true
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy-to-kind:
    name: deploy-to-kind
    runs-on: ubuntu-latest
    needs: build-and-push
    # GitHub Environment = the readiness gate. Configure "production" in repo
    # settings to require the `ci` status check (and optionally a reviewer)
    # before this job is allowed to run.
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: ci-cluster

      # The overlay's imagePullSecret patch references `ghcr-secret`, so it must
      # exist in the cluster before the manifests (which trigger the pull) apply.
      - name: Create GHCR pull secret
        run: |
          kubectl create namespace bookmarks
          kubectl create secret docker-registry ghcr-secret \
            --namespace bookmarks \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PAT }}

      - name: Apply Kubernetes manifests (kustomize)
        run: kubectl apply -k infra/k8s/overlays/prod

      - name: Pin image to the built digest and wait for rollout
        run: |
          kubectl -n bookmarks set image deployment/bookmarks-api \
            api=${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          kubectl -n bookmarks rollout status deployment/bookmarks-api --timeout=180s

      - name: Smoke test /health
        run: |
          kubectl -n bookmarks port-forward svc/bookmarks-api 8080:80 &
          PID=$!
          trap 'kill $PID' EXIT

          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/health | jq -e '.status == "ok"' > /dev/null 2>&1; then
              echo "health check passed after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done

          echo "health check failed" >&2
          kubectl -n bookmarks get pods >&2
          exit 1
