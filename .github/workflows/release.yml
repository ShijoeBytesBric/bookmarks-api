name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.1.4)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Determine the tag: use workflow_dispatch input if present, else
          # fall back to the push-triggered ref name (e.g. "v0.1.4").
          TAG="${{ inputs.tag || github.ref_name }}"

          # Auto-generated notes pull PR titles + commits since the last tag.
          gh release create "$TAG" \
            --generate-notes \
            --latest \
            --title "Release $TAG"
