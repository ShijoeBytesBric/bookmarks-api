name: Publish versioned image

# Points the vX.Y.Z tag at the image that CD already built and pushed for the
# same commit — no rebuild. Triggered either by a manual tag push (v*), or
# dispatched by bump-version.yml after it auto-increments the version on main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.1.4)'
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/shijoebytesbric/bookmarks-api

jobs:
  retag:
    name: retag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the retagged version tag to GHCR
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Resolve version
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tagging version: $TAG"

      # CD pushes a "main" tag on every merge to main. Point the version tag
      # at that same digest instead of rebuilding the image.
      - name: Retag CD image as version
        run: |
          TAG="${{ steps.version.outputs.version }}"
          for i in $(seq 1 30); do
            if DIGEST=$(docker buildx imagetools inspect \
                "${{ env.IMAGE_NAME }}:main" \
                --format '{{.Manifest.Digest}}' 2>/dev/null); then
              break
            fi
            sleep 10
          done
          [ -n "$DIGEST" ] || { echo "CD image not ready" >&2; exit 1; }
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:$TAG" \
            "${{ env.IMAGE_NAME }}@$DIGEST"
