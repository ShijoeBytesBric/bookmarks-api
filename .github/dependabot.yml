version: 2
updates:
  # Keep npm dependencies patched. Group minor+patch bumps into one PR so the
  # signal-to-noise ratio stays sane.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # Keep the pinned GitHub Actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
