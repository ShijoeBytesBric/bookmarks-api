apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookmarks-api
spec:
  replicas: 2
  # Zero-downtime rolling updates: never scale below the running set while a
  # new pod comes up.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: bookmarks-api
  template:
    metadata:
      labels:
        app: bookmarks-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Placeholder only — the CD workflow pins the real image+digest via
          # `kubectl set image`, so the manifest never needs in-repo edits.
          image: ghcr.io/YOUR-USERNAME/bookmarks-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: bookmarks-config
          # Same /health endpoint the Docker HEALTHCHECK and the CI smoke test use.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
